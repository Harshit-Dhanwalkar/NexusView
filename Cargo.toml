[package]
name = "NexusView"
version = "0.1.0"
edition = "2024"

[dependencies]
walkdir = "2.5.0"         # Directory traversal
petgraph = "0.8.2"        # Graph data structure
egui = "0.31.1"           # GUI framework
# eframe = "0.31.1"         # Native app framework for egui
eframe = { version = "0.31.1", features = ["wgpu"] }
egui_extras = "0.31.1"    # Egui utilities
egui-wgpu = "0.31.1"      # WGPU backend for egui
egui_commonmark = "0.20.0" # Markdown rendering in egui
serde = { version = "1.0", features = ["derive"] } # Serialization
serde_json = "1.0.140"    # JSON handling
regex = "1.11.1"          # Regular expressions (for links)
image = "0.25.6"          # Image loading and processing
rand = "0.9.1"            # Random number generation
syntect = "5.2.0"         # Syntax highlighting
once_cell = "1.21.3"      # Lazy static initialization
rayon = "1.10.0"          # Parallel processing
pdf = "0.9.0"             # PDF parsing
pdfium-render = "0.8.34"  # PDF rendering
anyhow = "1.0.98"         # Error handling
chrono = "0.4.41"         # Date and time utilities
pdf-extract = "0.9.0"     # PDF data extraction
gltf = "1.4.1"            # glTF loader for 3d objects
# wgpu = "26.0.1"           # rust graphics API
glam = "0.28.0"           # 3D math library for games and graphics
bytemuck = "1.21.0"
type-map = "0.5.1"        # Provides a typemap container with FxHashMap

[features]
default = []
no_pdf = [] # Feature to disable PDF support
